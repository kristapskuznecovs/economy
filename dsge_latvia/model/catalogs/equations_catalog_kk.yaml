# Legacy scratch/reference catalog.
# Not authoritative for current recovery work.
# The canonical catalog is `equations_catalog.yaml`.
version: 1
rules:
  - core_dynamic: must be included in g0/g1/π/ψ (no skipping allowed)
  - definitional: identities/aggregators; may be substituted or kept as identity
  - resolved_by_recursion: integral/indexed definition replaced by recursion/dispersion (explicitly allowlisted)
  - measurement: observables mapping; excluded from Phase 1 linear system
  - closure_or_regime: requires admissible parameters/closure; fail-fast if prerequisites unmet

